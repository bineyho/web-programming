
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My CSS Portfolio</title>
  <style>
    /* 1. Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* 2. Base styles (body, a, h1-h3, p) */
    body {
      font-family: Arial, sans-serif;
      background-color: #f1f5f9;
      color: #1e293b;
      line-height: 1.6;
    }

    a {
      text-decoration: none;
    }

    h1, h2, h3 {
      margin-bottom: 15px;
    }

    p {
      color: #64748b;
    }

    /* 3. Navigation */
    .nav {
      background-color: #1e293b;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 40px;
    }

    .nav-logo {
      color: white;
      font-size: 1.3rem;
      font-weight: bold;
    }

    .nav-links {
      display: flex;
      gap: 25px;
    }

    .nav-links a {
      color: white;
    }

    .nav-links a:hover {
      color: #10B981;
    }

    /* 4. Hero section */
    .hero {
      text-align: center;
      padding: 100px 20px;
      background-color: white;
    }

    .hero h1 {
      font-size: 3rem;
    }

    .hero p {
      font-size: 1.2rem;
      margin-bottom: 30px;
    }

    .btn {
      display: inline-block;
      background-color: #10B981;
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: bold;
    }

    .btn:hover {
      background-color: #059669;
    }

    /* 5. Skills grid */
    .skills-section {
      padding: 70px 40px;
      text-align: center;
    }

    .skills-grid {
      display: flex;
      gap: 25px;
      max-width: 1000px;
      margin: 30px auto 0;
    }

    .skill-card {
      flex: 1;
      background-color: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
    }

    .skill-card h3 {
      color: #10B981;
    }

    /* 6. Footer */
    .footer {
      background-color: #1e293b;
      color: white;
      text-align: center;
      padding: 25px;
    }

    .footer p {
      color: #cbd5e1;
    }
  </style>
</head>

<body>

  <nav class="nav">
    <span class="nav-logo">MyPortfolio</span>

    <div class="nav-links">
      <a href="#skills">Skills</a>
      <a href="#contact">Contact</a>
    </div>
  </nav>

  <section class="hero">
    <h1>Hello, I am Learning CSS!</h1>
    <p>Week 3 · CSS Introduction · Gachon University</p>
    <a href="#skills" class="btn">See My Skills</a>
  </section>

  <section class="skills-section" id="skills">
    <h2>What I Know</h2>

    <div class="skills-grid">
      <div class="skill-card">
        <h3>HTML5</h3>
        <p>Structure and semantics</p>
      </div>

      <div class="skill-card">
        <h3>CSS3</h3>
        <p>Styling and layout</p>
      </div>

      <div class="skill-card">
        <h3>Flexbox</h3>
        <p>Modern layout model</p>
      </div>
    </div>
  </section>

  <footer class="footer" id="contact">
    <p>K0126002 Web Programming &copy; 2026 Gachon University</p>
  </footer>

</body>
</html>
