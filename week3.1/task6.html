<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<style>
  
  :root {
    --primary: #0f766e;
    --accent: #14b8a6;
    --bg: #f0fdfa;
    --text: #134e4a;
    --radius: 12px;
  }

  
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  
  body {
    font-family: sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 30px;
  }

  h1 {
    margin-bottom: 20px;
  }

  
  .grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
  }

  
  @media (min-width: 640px) {
    .grid {
      grid-template-columns: repeat(3, 1fr);
    }
  }

  
  .card {
    border: 2px solid var(--accent);
    background: var(--bg);
    color: var(--text);
    padding: 20px;
    border-radius: var(--radius);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }

  /* Hover lift */
  .card:hover {
    transform: translateY(-6px);
    box-shadow: 0 8px 20px rgba(20, 184, 166, 0.3);
  }

  /* Emoji icon */
  .card[data-icon]::before {
    content: attr(data-icon) '  ';
    font-size: 2rem;
    display: block;
    margin-bottom: 10px;
  }

  /* Dark mode */
  @media (prefers-color-scheme: dark) {
    :root {
      --primary: #2dd4bf;
      --accent: #5eead4;
      --bg: #0f2926;
      --text: #ccfbf1;
    }
  }
</style>
</head>
<body>
  <h1>My Skills</h1>

  <div class="grid">
    <div class="card" data-icon="🌐">HTML5 — Structure</div>
    <div class="card" data-icon="🎨">CSS3 — Styling</div>
    <div class="card" data-icon="⚡">JavaScript — Behaviour</div>
    <div class="card" data-icon="📐">Flexbox — 1D Layout</div>
    <div class="card" data-icon="🗂">Grid — 2D Layout</div>
    <div class="card" data-icon="📱">Responsive — Any Screen</div>
  </div>
</body>
</html>
