
<!DOCTYPE html>
<html>
<body style="font-family:system-ui;padding:20px;max-width:400px;margin:auto">

  <style>
    h2 { color: #1a56db; }

    .add-row {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    input {
      flex: 1;
      padding: 8px 12px;
      border: 2px solid #c8d4f0;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
    }

    .add-btn {
      background: #1a56db;
      color: white;
    }

    #todo-list {
      list-style: none;
      padding: 0;
    }

    .todo-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      margin-bottom: 6px;
      background: #f0f4ff;
      border-radius: 8px;
      border: 1px solid #c8d4f0;
    }

    .del-btn {
      background: #dc2626;
      color: white;
      padding: 4px 10px;
      font-size: 12px;
      border-radius: 6px;
    }

    #empty-msg {
      color: #9ca3af;
      text-align: center;
      padding: 20px;
      display: none;
    }
  </style>

  <h2>My To-Do List</h2>

  <div class="add-row">
    <input id="todo-input" type="text" placeholder="Add a task...">
    <button id="add-btn" class="add-btn">+ Add</button>
  </div>

  <ul id="todo-list"></ul>

  <p id="empty-msg">No tasks yet! Add one above.</p>

  <script>
    // 1. Select the required elements
    const input = document.querySelector('#todo-input');
    const addBtn = document.querySelector('#add-btn');
    const todoList = document.querySelector('#todo-list');
    const emptyMsg = document.querySelector('#empty-msg');

    // Update the empty message
    function updateEmptyMessage() {
      emptyMsg.style.display =
        todoList.children.length === 0 ? 'block' : 'none';
    }

    // 2. Function to add a task
    function addTask() {
      const taskText = input.value.trim();

      // Skip if the input is empty
      if (taskText === '') {
        return;
      }

      // Create a new list item
      const li = document.createElement('li');
      li.classList.add('todo-item');

      // Create the task text
      const span = document.createElement('span');
      span.textContent = taskText;

      // Create the delete button
      const deleteBtn = document.createElement('button');
      deleteBtn.textContent = '✕';
      deleteBtn.classList.add('del-btn');

      // Add text and button to the list item
      li.appendChild(span);
      li.appendChild(deleteBtn);

      // Add the item to the list
      todoList.appendChild(li);

      // Clear the input
      input.value = '';

      // Update the empty message
      updateEmptyMessage();

      // Focus input for the next task
      input.focus();
    }

    // 3. Add task when clicking Add
    addBtn.addEventListener('click', addTask);

    // 4. Add task when pressing Enter
    input.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        addTask();
      }
    });

    // 5. Event delegation for deleting tasks
    todoList.addEventListener('click', function(e) {
      if (e.target.classList.contains('del-btn')) {
        const li = e.target.closest('li');
        li.remove();
        updateEmptyMessage();
      }
    });

    // Show the empty message initially
    updateEmptyMessage();
  </script>

</body>
</html>
