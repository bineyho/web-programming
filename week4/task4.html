
<!DOCTYPE html>
<html>
<body style="font-family:system-ui;padding:20px;max-width:420px;margin:auto">

  <style>
    h2 { color: #1a56db; }

    #search {
      width:100%;
      padding:10px 14px;
      font-size:16px;
      border:2px solid #1a56db;
      border-radius:10px;
      margin-bottom:14px;
      box-sizing:border-box;
    }

    .student {
      padding:10px 14px;
      margin-bottom:6px;
      background:#f0f4ff;
      border-radius:8px;
      border:1px solid #c8d4f0;
      font-size:15px;
    }

    mark {
      background:#f7df1e;
      border-radius:3px;
    }

    #no-results {
      display:none;
      color:#9ca3af;
      text-align:center;
      padding:20px;
    }
  </style>

  <h2>Student Search</h2>

  <input id="search" type="text" placeholder="Search students...">

  <div id="student-list">
    <div class="student" data-name="Kim Jisoo">Kim Jisoo — Web Programming</div>
    <div class="student" data-name="Park Minjun">Park Minjun — Computer Science</div>
    <div class="student" data-name="Lee Sooyeon">Lee Sooyeon — Software Engineering</div>
    <div class="student" data-name="Choi Hyunwoo">Choi Hyunwoo — Artificial Intelligence</div>
    <div class="student" data-name="Jung Yuna">Jung Yuna — Data Science</div>
    <div class="student" data-name="Kang Seojun">Kang Seojun — Web Programming</div>
  </div>

  <p id="no-results">No students found.</p>

  <script>
    // 1. Select the search box
    const search = document.querySelector('#search');

    // 2. Select all student rows
    const students = document.querySelectorAll('.student');

    // 3. Select no-results message
    const noResults = document.querySelector('#no-results');

    // 4. Listen for input event
    search.addEventListener('input', function(e) {

      // Get search text in lowercase
      const term = e.target.value.toLowerCase();

      let visibleCount = 0;

      // 5. Check each student
      students.forEach(function(student) {

        const name = student.getAttribute('data-name');
        const originalText = student.textContent;

        if (name.toLowerCase().includes(term)) {

          // Show matching student
          student.style.display = '';

          // Highlight matching text
          const regex = new RegExp(
            '(' + term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')',
            'gi'
          );

          student.innerHTML = term
            ? originalText.replace(regex, '<mark>$1</mark>')
            : originalText;

          visibleCount++;

        } else {

          // Hide non-matching student
          student.style.display = 'none';
        }

      });

      // 6. Show message if no students match
      noResults.style.display =
        visibleCount === 0 ? 'block' : 'none';

    });
  </script>

</body>
</html>
